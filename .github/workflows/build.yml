name: Build
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_signing:
        description: Verify fork signing Secrets and upload a signed APK (owner only; no Release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      # 普通 CI 不读取签名 Secrets，PR 与外部 fork 也能验证。
      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity, metadata and signature
        run: python3 .github/scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TalkTact-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signing:
    name: Verify fork signing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_signing && github.repository == 'Sakura520222/TalkTact' && github.actor == github.repository_owner
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      - name: Restore fork signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
        run: bash .github/scripts/restore_signing.sh
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and pinned certificate
        run: python3 .github/scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk --expected-cert signing/certificate.sha256
      - name: Prepare signed verification artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-verification"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/signing-verification/TalkTact-fork-signed.apk"
          cd "$RUNNER_TEMP/signing-verification"
          sha256sum TalkTact-fork-signed.apk > TalkTact-fork-signed.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TalkTact-signed-${{ github.sha }}
          path: ${{ runner.temp }}/signing-verification/
          if-no-files-found: error
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/talktact.p12"
