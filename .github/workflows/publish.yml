name: Prepare fork release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (must match versionName, e.g. v0.8.12-fork.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Sakura520222/TalkTact'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: Sakura520222/TalkTact
    steps:
      - name: Validate trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow from main with an existing version tag.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and version
        id: version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text(encoding='utf-8')
          name = re.search(r'versionName = "([^"]+)"', source).group(1)
          code = re.search(r'versionCode = (\d+)', source).group(1)
          if os.environ['RELEASE_TAG'] != 'v' + name:
              raise SystemExit('Tag must match versionName exactly')
          fingerprint = pathlib.Path('signing/certificate.sha256').read_text().strip()
          if not re.fullmatch(r'[0-9A-Fa-f]{64}', fingerprint):
              raise SystemExit('Missing fork signing certificate fingerprint')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={code}\n')
          PY
      - name: Refuse existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING_TAGS=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$EXISTING_TAGS" | grep -Fxq -- "$RELEASE_TAG"; then
            echo '::error::A release already exists for this tag. Existing releases are immutable.'
            exit 1
          fi
      - uses: ./.github/actions/setup-android-build
      - name: Unit tests before restoring signing material
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Restore fork signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
        run: bash .github/scripts/restore_signing.sh
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify release APK and pinned certificate
        run: python3 .github/scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk --expected-cert signing/certificate.sha256
      - name: Create draft in this fork
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ASSET="TalkTact-$VERSION_NAME-fork.apk"
          [[ "$VERSION_NAME" != *-fork.* ]] || ASSET="TalkTact-$VERSION_NAME.apk"
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/$ASSET"
          cd "$RUNNER_TEMP/release"
          sha256sum "$ASSET" > "$ASSET.sha256"
          {
            printf 'TalkTact %s · 独立二改（versionCode %s）\n\n' "$VERSION_NAME" "$VERSION_CODE"
            printf '源码及变更：https://github.com/%s/tree/%s\n\n' "$GH_REPO" "$RELEASE_TAG"
            printf '基于 shibry88-netizen/TalkTact，保留 GPL-3.0 及原作者归属。\n\n'
            printf '应用名称仍为 TalkTact，包名仍为 io.github.shibry88_netizen.talktact。\n'
            printf '本 fork 使用独立签名：从原版或 CI 临时 debug 包切换时，先导出备份，再卸载旧版安装并导入。\n'
            printf '本模块只填入候选，不自动发送；修改微信行为存在账号风险。\n\n'
            printf 'SHA-256：%s\n' "$(cut -d' ' -f1 "$ASSET.sha256")"
          } > notes.md
          # create 在同 tag 已有 Release 时失败，禁止覆盖附件或编辑旧发行物。
          EXTRA=()
          [[ "$VERSION_NAME" != *-* ]] || EXTRA+=(--prerelease)
          gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --repo "$GH_REPO" \
            --verify-tag --draft "${EXTRA[@]}" --title "TalkTact $VERSION_NAME · 独立二改" --notes-file notes.md
      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/talktact.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/screenshots/
          if-no-files-found: ignore
