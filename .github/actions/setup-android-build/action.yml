name: Set up Android build
description: Shared JDK, Android SDK and Gradle Wrapper setup for this fork
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Install Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        CLI="$SDK_ROOT/cmdline-tools/latest/bin/android"
        if [[ -x "$CLI" ]]; then
          "$CLI" --no-metrics --sdk="$SDK_ROOT" sdk install platforms/android-37.0 build-tools/36.0.0
        else
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
        fi
        test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
        test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
